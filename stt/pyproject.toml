[project]
name = "ai-stt"
version = "0.1.0"
description = "NeMo-based speech-to-text service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai",
    "braceexpand",
    "cloudpickle",
    "datasets",
    "editdistance",
    "einops",
    "fiddle",
    "hydra-core>1.3,<=1.3.2",
    "inflect",
    "jiwer>=3.1,<4",
    "kaldi-python-io",
    "lhotse",
    "librosa>=0.10.1",
    "lightning>2.2.1,<=2.4",
    "marshmallow",
    "mediapy==1.1.6",
    "nemo-toolkit==2.4.*",
    "omegaconf<=2.3",
    "optuna",
    "packaging",
    "pandas",
    "peft",
    "pyannote-core",
    "pyannote-metrics",
    "pydub",
    "pyloudnorm",
    "python-multipart",
    "resampy",
    "ruamel-yaml",
    "sacremoses>=0.0.43",
    "scipy",
    "sentencepiece<1",
    "soundfile",
    "sox<=1.5",
    "torch==2.11.0",
    "torchaudio==2.11.0; sys_platform == 'linux'",
    "torchmetrics>=0.11",
    "transformers>=4.51,<=4.52",
    "webdataset>=0.2.86",
    "whisper-normalizer",
]

[tool.uv.sources]
ai = { workspace = true }
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.uv]
package = false
