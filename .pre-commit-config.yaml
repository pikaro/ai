# .pre-commit-config.yaml
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: unittest
        name: Python unit tests
        entry: uv run --frozen python -m unittest discover
        language: system
        pass_filenames: false

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: pyright
        name: Pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
