[project]
name = "ai-tts"
version = "0.1.0"
description = "Pocket TTS speech synthesis service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai",
    "pocket-tts",
    "python-multipart",
    "torch==2.11.0",
]

[tool.uv.sources]
ai = { workspace = true }
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.uv]
package = false
