model_id: qwen3-4b-instruct
log_level: INFO
listen_port: 8080
llm_base_url: http://llama-server.llama-server
stt_base_url: http://nemo-asr.nemo-asr
tts_base_url: http://pockettts.pockettts
multi_voice:
  default_character: assistant
  characters:
    assistant:
      voice: default
      marker: "§"
system_prompt_path: /tmp/system-prompt
llm_slots: [0]
llm_cache_warm_enabled: true
llm_cache_warm_min_interval_seconds: 0.5
llm_cache_warm_min_new_characters: 1
default_timezone: Europe/Berlin

mcp:
  home:
    host: home-mcp
    port: 8080
    scheme: http
    path: /mcp
    enabled: true
    transport: streamable-http
    timeout_seconds: 10
    retry_seconds: 30

  calendar:
    url: http://calendar-mcp:8080/mcp
    enabled: true
    transport: streamable-http
    timeout_seconds: 10
    retry_seconds: 30
